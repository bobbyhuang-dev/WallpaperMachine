# Build the Release app on macOS, prove what was built, and attach its disk image to the
# tag's GitHub Release.
#
# Called by Version right after it pushes a bump tag, and by Release for hand-pushed
# tags. Version has to call it directly: a tag pushed with GITHUB_TOKEN never starts
# another workflow, so Release alone would never run for CI-produced tags.
#
# The release is created as a draft and published only after the disk image it needs is
# uploaded, so the in-app updater never sees a "latest" release with nothing to
# download. Everything published is derived from the build or recorded at the tag: the
# notes from the tag's CHANGELOG.md section, the checksum from the image, the
# provenance attestation from this run.
name: Build

on:
  workflow_call:
    inputs:
      tag:
        description: "Version tag to build and publish."
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-26
    timeout-minutes: 150
    permissions:
      contents: write
      # actions/attest-build-provenance signs with a workflow OIDC token and records
      # the attestation against the repository.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          # Release notes read the commits between this tag and the previous one.
          fetch-depth: 0

      - name: Write the release notes
        # Before the long build, so a notes problem fails in seconds. The notes are the
        # tag's CHANGELOG.md section, which Version had the release-notes model write;
        # only a hand-pushed tag without one asks the model now, which needs the key.
        env:
          TAG: ${{ inputs.tag }}
          RELEASE_NOTES_API_KEY: ${{ secrets.RELEASE_NOTES_API_KEY }}
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py --tag "$TAG" --release-body --ai \
            --built-from "$(git rev-parse HEAD)" --output "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Install renderer and Xcode project dependencies
        run: |
          set -euo pipefail
          brew install --quiet xcodegen cmake quickjs-ng glslang freetype lz4 \
            vulkan-loader vulkan-headers molten-vk eigen nlohmann-json argparse shaderc \
            spirv-tools glm
          # The bundled FFmpeg is the repository's LGPL build, not Homebrew's GPLv3 one (LICENSING.md).
          python3 scripts/install_ffmpeg.py

      - name: Cache renderer build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/renderer/target
          key: renderer-${{ hashFiles('upstream/renderer/Cargo.lock') }}
          restore-keys: renderer-

      - name: Build
        run: |
          set -euo pipefail
          xcodebuild -version
          python3 scripts/build.py --configuration Release

      - name: Test
        # A published binary has passed the same gate a change has to pass. The
        # renderer and the generated bridge already exist from the build step, so
        # this adds the test target, not another renderer build.
        run: python3 scripts/test.py

      - name: Package
        # Relocates and signs the bundle, wraps it in the drag-to-install disk image,
        # mounts that image to check the app's identifier, version, signature and the
        # Applications link, and writes the .sha256 sidecar (docs/build.md).
        run: python3 scripts/package.py --configuration Release

      - name: Match the disk image to the tag
        id: image
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          directory="build/Build/Products/Release"
          name="WallpaperMachine-${TAG#v}-arm64.dmg"
          if [ ! -f "${directory}/${name}" ]; then
            echo "::error::No ${name} in ${directory}. scripts/package.py names the image from the built bundle's CFBundleShortVersionString, so the version bump never reached this build."
            ls -1 "${directory}"/*.dmg 2>/dev/null || true
            exit 1
          fi
          {
            echo "image=${directory}/${name}"
            echo "checksum=${directory}/${name}.sha256"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### \`${name}\`"
            echo ""
            echo '```'
            cat "${directory}/${name}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the build provenance
        # The SLSA predicate records this workflow run and the revision that
        # triggered it. For a Version-produced tag that trigger is the push to main,
        # not the bump commit the tag points at, so the attestation identifies the
        # run and the builder, not the built source. The notes carry the built
        # revision instead, and it is checkable against the tag.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.image.outputs.image }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          IMAGE: ${{ steps.image.outputs.image }}
          CHECKSUM: ${{ steps.image.outputs.checksum }}
        # Drafts first, a live release is refused rather than clobbered, and Latest
        # is claimed only when no greater version is public: scripts/publish_release.py,
        # covered by scripts/tests/test_publish_release.py.
        run: |
          python3 scripts/publish_release.py --tag "$TAG" --notes "${RUNNER_TEMP}/notes.md" \
            "$IMAGE" "$CHECKSUM"
