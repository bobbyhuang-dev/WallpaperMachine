# Build and publish a GitHub Release for a hand-pushed version tag.
# Tags created by the Version workflow are published by that workflow instead,
# because a tag pushed with GITHUB_TOKEN does not start this one.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Same group as Version's publish job: one tag is only ever built once at a time.
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
