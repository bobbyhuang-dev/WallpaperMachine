# Bump MARKETING_VERSION from a `release:` commit on main.
#
# Commit subject (or any line in a pushed commit, including a squash title):
#   release: patch | minor | major | x.y.z | vx.y.z
#
# CI updates project.yml and mac-wallpaper-engine.xcodeproj, commits
# `chore: bump version to x.y.z`, and tags `vx.y.z`.
name: Version

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      spec:
        description: "patch, minor, major, or x.y.z"
        required: true
        default: patch
        type: string

concurrency:
  group: version-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version files
        id: bump
        env:
          RELEASE_SPEC: ${{ github.event.inputs.spec }}
        run: python3 scripts/bump_version.py --ci --apply

      - name: Commit, tag, and push
        if: steps.bump.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.new_marketing }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; not pushing a duplicate bump."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.yml mac-wallpaper-engine.xcodeproj/project.pbxproj
          git diff --cached --quiet && { echo "No version file changes to commit."; exit 0; }
          git commit -m "chore: bump version to ${VERSION}"
          git tag "${TAG}"
          git push --atomic origin "HEAD:${{ github.ref_name }}" "refs/tags/${TAG}"
