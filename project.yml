# Single source of truth for the Xcode project. Regenerate with `xcodegen generate`
# (scripts/build.py and scripts/test.py do this automatically) and commit the result.
# Directory layout and the meaning of each source path: docs/repository-layout.md.
name: mac-wallpaper-engine
options:
  bundleIdPrefix: app.mac-wallpaper-engine
  deploymentTarget:
    macOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEVELOPMENT_TEAM: ""
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    ENABLE_DEBUG_DYLIB: NO
targets:
  MediaRemoteAdapter:
    type: framework
    platform: macOS
    sources:
      - path: upstream/mediaremote-adapter/src
        excludes:
          - test
      - path: upstream/mediaremote-adapter/include
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mac-wallpaper-engine.MediaRemoteAdapter
        GENERATE_INFOPLIST_FILE: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/upstream/mediaremote-adapter/include"
          - "$(SRCROOT)/upstream/mediaremote-adapter/src"
    dependencies:
      - sdk: Foundation.framework
      - sdk: AppKit.framework
      - sdk: UniformTypeIdentifiers.framework
  MacWallpaperEngine:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Resources/Info.plist
          # Vendored upstream localization of NSAudioCaptureUsageDescription. Info.plist
          # already supplies that key, so the catalog stays out of the build until the app
          # ships localized permission strings deliberately.
          - Resources/InfoPlist.xcstrings
          - Bridge/Generated/WallpaperBridgeFFI.h
          - Bridge/Generated/WallpaperBridgeFFI.modulemap
      - path: Shared
      - path: WebUI
        type: folder
        buildPhase: resources
      - path: Resources/StarterWallpaper
        type: folder
        buildPhase: resources
      - path: upstream/mediaremote-adapter/bin/mediaremote-adapter.pl
        buildPhase: resources
      - path: upstream/mediaremote-adapter/LICENSE
        buildPhase: resources
    dependencies:
      - target: MediaRemoteAdapter
        embed: true
        link: false
      - target: MacWallpaperExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mac-wallpaper-engine
        PRODUCT_NAME: MacWallpaperEngine
        INFOPLIST_FILE: App/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "16"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/App/Bridge/Generated"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/App/Bridge/Generated"
        LIBRARY_SEARCH_PATHS: &rendererLibraryPaths
          - "$(SRCROOT)/upstream/renderer/target/release"
          - /opt/homebrew/opt/ffmpeg@8/lib
          - /opt/homebrew/lib
          - /opt/homebrew/opt/quickjs-ng/lib
          - /opt/homebrew/opt/glslang/lib
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/App/Bridge/Generated/WallpaperBridgeFFI.modulemap"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - /opt/homebrew/opt/ffmpeg@8/lib
          - /opt/homebrew/lib
          - /opt/homebrew/opt/quickjs-ng/lib
        OTHER_LDFLAGS: &rendererLinkerFlags
          - -lwallpaper_bridge
          - -lc++
          - -lvulkan
          - -llz4
          - -lfreetype
          - -lavformat
          - -lavcodec
          - -lavutil
          - -lswresample
          - -lavfilter
          - -lavdevice
          - -lswscale
          - -lqjs
          - -lglslang
          - -lSPIRV
          - -lglslang-default-resource-limits
          - -liconv
          - -framework Accelerate
          - -framework AppKit
          - -framework CoreAudio
          - -framework CoreData
          - -framework CoreFoundation
          - -framework CoreGraphics
          - -framework CoreImage
          - -framework CoreMedia
          - -framework CoreText
          - -framework CoreVideo
          - -framework Foundation
          - -framework IOSurface
          - -framework Metal
          - -framework OpenGL
          - -framework QuartzCore
          - -framework VideoToolbox
  MacWallpaperExtension:
    type: extensionkit-extension
    platform: macOS
    sources:
      - path: Extension
        excludes:
          - Info.plist
          - WallpaperExtension.entitlements
      - path: Shared
      - path: Resources/StarterWallpaper/preview.jpg
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mac-wallpaper-engine.wallpaper-extension
        PRODUCT_NAME: MacWallpaperExtension
        INFOPLIST_FILE: Extension/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MacWallpaperEngine Lock Screen
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "16"
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: Extension/WallpaperExtension.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_OBJC_BRIDGING_HEADER: Extension/WallpaperExtensionBridge.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/upstream/renderer/external/open-wallpaper-engine/src/Platform/Apple"
        LIBRARY_SEARCH_PATHS: *rendererLibraryPaths
        OTHER_LDFLAGS: *rendererLinkerFlags
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
          - /opt/homebrew/opt/ffmpeg@8/lib
          - /opt/homebrew/lib
          - /opt/homebrew/opt/quickjs-ng/lib
        SKIP_INSTALL: YES
  MacWallpaperEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/Unit
    dependencies:
      - target: MacWallpaperEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mac-wallpaper-engine.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacWallpaperEngine.app/Contents/MacOS/MacWallpaperEngine"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_INCLUDE_PATHS: "$(SRCROOT)/App/Bridge/Generated"
        HEADER_SEARCH_PATHS: "$(SRCROOT)/App/Bridge/Generated"
        OTHER_SWIFT_FLAGS: "-Xcc -fmodule-map-file=$(SRCROOT)/App/Bridge/Generated/WallpaperBridgeFFI.modulemap"
  MacWallpaperEngineUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/UI
    dependencies:
      - target: MacWallpaperEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.mac-wallpaper-engine.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MacWallpaperEngine
schemes:
  MacWallpaperEngine:
    build:
      targets:
        MacWallpaperEngine: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacWallpaperEngineTests
  MacWallpaperEngineUI:
    build:
      targets:
        MacWallpaperEngine: all
    test:
      config: Debug
      targets:
        - MacWallpaperEngineUITests
